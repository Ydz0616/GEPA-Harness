te values.\n- Contrast with the `\"delta\"` branch, which uses subtraction `(1 * unit - 1 * unit).units` and is therefore allowed to produce delta units for differences.\n- `docs/nonmult.rst` (approximately lines 94\u201397) documents the ambiguity.\n- Auto-converting variance to `delta_degC\u00b2` would silently reinterpret absolute readings as intervals. Pint instead refuses to guess and forces the user to convert to kelvin or work explicitly in delta units.\n- Test coverage may be in `pint/testsuite/test_numpy_func.py` (approximately lines 172\u2013173 for `get_op_output_unit(\"variance\", ureg.degC)`).\n\n### Pint registry architecture\n\nWhen the question is about Pint\u2019s hierarchical registry design:\n\n- Pint\u2019s registry is split into five capability classes:\n  - `BaseRegistry`\n  - `NonMultiplicativeRegistry(BaseRegistry)`\n  - `ContextRegistry(BaseRegistry)`\n  - `SystemRegistry(BaseRegistry)`\n  - `UnitRegistry(SystemRegistry, ContextRegistry, NonMultiplicativeRegistry)`\n- The MRO is effectively:\n  `UnitRegistry \u2192 SystemRegistry \u2192 ContextRegistry \u2192 NonMultiplicativeRegistry \u2192 BaseRegistry`.\n- Support/plumbing classes include `RegistryMeta`, `RegistryCache`, `ContextCacheOverlay`, `LazyRegistry`, and `ApplicationRegistry`; these are not separate capability tiers.\n- `BaseRegistry` handles units, prefixes, dimensions, definition-file parsing, `parse_expression`, `wraps` / `check`, and `define`. Its conversion contract is multiplicative: `_convert` checks dimensionality, then uses `_get_root_units(src / dst)`. Its `_define` docstring says it defines only multiplicative units, converting other types to `delta_` units.\n- `NonMultiplicativeRegistry` adds `default_as_delta` and `autoconvert_offset_to_baseunit`; overrides `_parse_units`, `_define`, and `_convert`; and uses `_validate_and_extract` to enforce \u201cat most one offset unit per dimension, exponent 1.\u201d\n- `ContextRegistry` adds `@context` parsing, `enable_contexts` When the question is about how \`responses\` preserves decorated function signatures for pytest-style fixture injection:

- \`activate()\` is a thin front end that hands an ordinary function to \`get_wrapped()\` rather than writing its own generic wrapper.
- \`get_wrapped()\` synthesizes a new function as source code whose parameter list is copied from the decorated callable, then \`exec\`s it. The generated wrapper therefore has a real argspec, so pytest’s collection-time fixture discovery sees names such as \`self\`, \`monkeypatch\`, and \`tmp_path\` instead of an opaque \`*args, **kwargs\`.
- The wrapper template is essentially:
  \`def wrapper%(wrapper_args)s:\`
  \`    with responses:\`
  \`        return func%(func_args)s\`
  It is executed with an eval dict containing \`func\` and \`responses\`, then the generated \`wrapper\` is returned.
- Python 3 branch:

  - remove the return annotation with \`signature.replace(return_annotation=inspect.Signature.empty)\`

  - \`wrapper_args = str(signature)\` is used in the \`def\` line
  - for the call side, strip annotations and defaults to build \`func_args\`

- Why source generation instead of plain \`functools.wraps\`:
  - \`wraps\` copies metadata and sets \`__wrapped__\`, but the wrapper’s own \`__code__\` is still \`(*args, **kwargs)\`.
  - Fixture injection is resolved from the signature at collection time. Any path that reads the function object directly does not follow \`__wrapped__\` and sees no parameter names, so fixtures fail to inject or pytest errors about unknown arguments.

- Costs and traps:
  - String-generated code can raise \`SyntaxError\` at decoration time for odd signatures.
  - Return annotations are the classic trap: leaving \`return_annotation\` in can generate a call like \`return func(self) -&gt; None\`, which is invalid syntax. That is why the Python 3 branch strips the return annotation before building \`func_args\`.

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
